<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gemini AI Chatbot</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="chat-container">
    <h1>Gemini AI Chatbot</h1>
    <div id="chat-box" class="chat-box">
      <!-- Pesan Selamat Datang Awal -->
      <div class="welcome-message">
        <h2>Selamat Datang!</h2>
        <p>Ini adalah chatbot yang didukung oleh Gemini AI. Ajukan pertanyaan apa pun, dan saya akan mencoba menjawabnya. Misalnya: "Apa itu Node.js?"</p>
      </div>
    </div>
    <form id="chat-form">
      <!-- Tombol Upload File -->
      <label for="file-input" class="file-upload-button">
        📎
      </label>
      <input type="file" id="file-input" hidden />
      <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off" required />
      <button type="submit">Send</button>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
